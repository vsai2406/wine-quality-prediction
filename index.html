<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wine Quality Prediction</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
        }

        .btn-custom {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border: none;
            color: white;
            font-weight: bold;
        }

        .btn-custom:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4" style="width: 750px;">
        
        <h3 class="text-center mb-4">🍷 Wine Quality Prediction</h3>

        <form action="/predict" method="post">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Fixed Acidity</label>
                    <input type="number" step="any" name="val1" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Volatile Acidity</label>
                    <input type="number" step="any" name="val2" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Citric Acid</label>
                    <input type="number" step="any" name="val3" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Residual Sugar</label>
                    <input type="number" step="any" name="val4" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Chlorides</label>
                    <input type="number" step="any" name="val5" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Free Sulfur Dioxide</label>
                    <input type="number" step="any" name="val6" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Total Sulfur Dioxide</label>
                    <input type="number" step="any" name="val7" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Density</label>
                    <input type="number" step="any" name="val8" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>pH</label>
                    <input type="number" step="any" name="val9" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Sulphates</label>
                    <input type="number" step="any" name="val10" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Alcohol</label>
                    <input type="number" step="any" name="val11" class="form-control" required>
                </div>

            </div>

            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-custom">Predict Quality</button>
            </div>

        </form>

        <!-- Prediction Result -->
        <div class="text-center mt-3">
            <h5>{{ prediction_text }}</h5>
        </div>

    </div>

</div>

</body>
</html>
